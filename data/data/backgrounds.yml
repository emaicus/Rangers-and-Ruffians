-   name: Ruffian
    description: "You were a criminal, perhaps a thief, smuggler, or taking the law into your own hands.
                    Your experience will help your party fight the villains that stalk the realms so that you can atone for the crimes of your past."
    tips:
        -   name: You are a Hero
            text: "Remember that this is a story of adventurers, not villains. Even though you are were
                criminal, as an adventurer you must still be on the side of the light. Think about how 
                you can attempt to put your past behind you, but also about how it can rear its ugly
                head during your adventures."
    options:
        -   question: What sort of crimes did you commit?
            answers:
                - I was a sneakthief. I picked pockets and broke into homes.
                - I was a highwayman. I stopped travellers on the road and robbed them.
                - I was a con-artist. I duped people out of their money.
                - I was a smuggler. I sold illegal goods on the blackmarket.
                - I was a high-class criminal. I used power to line my own pockets.
                - I took the law into my own hands.
        -   question: Why did you leave your life of crime?
            answers:
                - I was caught and served a punishment.
                - I had one too many close calls.
                - I had a falling out with my associates.
                - I was only a criminal because I had to be.
                - No matter how hard I try to give up being a criminal, I keep getting pulled right back in.
                - I found something that made my future brighter. I wouldn't risk it for anything.
        -   question: What is your ruffian's quirk?
            answers:
                - I always believe that I am in the right.
                - I am deeply aware of my demons and don't want to break the law again.
                - I have a mark that brands me as a criminal.
                - I am deeply tempted by my vices, and often slip back into my old ways.
                - I have delusions of granduer. I am the greatest criminal the world has ever seen!
                - I have deep code of honor which dictates how I act.
    starting_equipment:
        -   Five gold per character level
            #quantity: 5
            #level_multiplier: true
        -   "A Thieve's Kit"
            #kit: true
        -   "Commoner's Clothes"
        -   "A dark cloak"
-   name: Scholar
    description: "You are among the learned people in the realm, specializing in a specific field of inquiry.
        Many scholars are shut-in by nature, and going into the field is a feat of necessity and bravery."
    options:
        -   question: "What is your area of research?"
            answers:
                - Magic! I explore the wonders of the arcane.
                - History! I marvel at the glory of the ancients!
                - Monsters! From dragons to tadlings, I want to know everything!
                - Politics! The who's who of the court gives my life purpose!
                - Something obscure! You've probably never heard of it...
                - Geography! I want to map out places unknown!
        -   question: What is your scholar's quirk?
            answers:
                - I am scatterbrained. My thoughts flit from topic to topic.
                - I am pompous. I'm an expert, you know!
                - I am baffled when my booksmarts don't apply to real life.
                - I cart around far more than I need.
                - I have imposter syndrome. I don't think I'm as intelligent as I actually am.
                - I am always taking notes, even if it is socially unacceptable.
        -   question: What forced you into the field?
            answers:
                - I discovered something of great import and must investigate it!
                - I want to achieve tenure at my institution and to do that I need field experience.
                - Going on adventures has been my life's dream!
                - My presence was requested by a collegue to whom I owe a favor.
                - I was thrown out of academia in disgrace.
                - I suspect my rival is close to a major discovery, and I must beat them to the chase!
    starting_equipment:
        - Three gold per character level
            #quantity: 3
            #level_multiplier: true
        - "A collection of books"
        - "Fine Clothes"
        - "Commoner's Clothes"
        - "A map of a distant location"
-   name: Wanderer
    description: "Wanderers roam the realms, coming and going as they please. As a wanderer, you are used to the harsh conditions of the wilds, and have
        far-flung connections that may help your adventuring party."
    options:
        -   question: What lead to your wandering?
            answers:
                - I have the itch. Discovering new things is what keeps me going.
                - I am searching for something, but I've never found it.
                - I am being hunted, so I never stay in one place for long.
                - I travel, observe and spread information.
                - I am no longer welcome back home.
                - I am a member of an order of wanderers.
        -   question: What lead you to become an adventurer?
            answers:
                - It was an accident, I assure you.
                - I bore witness to a great misfortune and now do everything I can to help people.
                - I am in need of gold. Money is hard to come by, and adventuring pays well.
                - It started as a favor. Someone was in need and I helped.
                - I have a strict code of honor. I cannot turn a blind eye.
                - I have done terrible things. I am trying to atone for them by adventuring.
        -   question: What is your wanderers quirk?
            answers:
                - I am very frugal and have very few possessions.
                - At this point, I actually prefer sleeping in stables or outside of town.
                - I try to bring a smile to every face I can.
                - I know someone in every town. I am always dropping in on old friends.
                - I sometimes talk aloud to myself or my animals.
                - People tend to distrust me. I have to work to get them to let me in.
    starting_equipment:
        -   Three gold per character level
            #quantity: 3
            #level_multiplier: true
        -   "A Common Dagger"
        -   "A Common Short Bow"
        -   "A Pack Animal"
        -   "An Adventuring Kit"
        -   "Commoner's Clothing"
-   name: Urchin
    description: "You were raised by the streets. Many urchins had to beg for their food or were thrown into orphanages.
                    As an adventurer, maybe you can save those you care about and put your past behind you."
    options:
        -   question: What is your Urchin's Quirk?
            answers:
                - I eat ravenously whenever there is food available, sometimes until I am sick.
                - I have to resist the urge to pickpocket, even to this day.
                - I have a deep distrust of law enforcement.
                - I have a sickly constitution and a cough that will never go away.
                - I have a good sense of when danger is coming, and my instinct is to run and not look back.
                - I keep my possessions close. I get very angry when people touch my things. 
        -   question: How did you make it on the streets?
            answers:
                - I had a sibling who looked out for me.
                - I had a sibling who I had to look out for.
                - I joined a gang of thugs and became a criminal.
                - I was in and out of an orphanage as a kid.
                - I was resilient, found work, and pulled myself up by my bootstraps.
                - I barely scraped by. I begged for what I got. Sometimes, I took without asking.
        -   question: How did you end up as an adventurer?
            answers:
                - It's a way to earn money.
                - I always idolized adventurers and wanted to be one.
                - I was pulled out of my situation by an adventurer and never looked back.
                - I got tied up in dark dealings. I know that I need a change before it's too late.
                - I have people who look up to me. I can't let them down.
                - I let down the people I care about. I have to atone for what I've done.
    starting_equipment:
        -   One gold piece per character level
            #quantity: 1
            #level_multiplier: true
        -   "A Common Dagger"
        -   "Commoner's Clothes"
        -   "A Memento"
-   name: Commoner
    description: "You are the salt of the earth. As a commoner, you have lived a largely uneventful life. Now, something has happened
                    and you find yourself thrust into a world of adventure that you never planned for."
    options:
        -   question: What was your life like before you were an adventurer?
            answers:
                - I was successful. I owned a shop and made good money.
                - I was aimless. I toiled away as a day laborer and spent my earnings at taverns.
                - I was a hard worker. I farmed the land and grew crops to sell and to see me through the winter.
                - I was a layabout. My friends and family supported me.
                - I was happy. My path was clear, and I thought I knew what the future held.
                - I was bored. I went through the motions and excelled, but my heart wasn't in my work.
        -   question: What is your Commoner's Quirk?
            answers:
                - I want to try everything!
                - When I am nervous, I make smalltalk and inevitably bring up the weather.
                - I am deeply superstitious.
                - I think the rich live worry free and are the cause of all of my woes.
                - I am frightened of monsters.
                - I only trust things that are familiar to me.
        -   question: Why did you take up a life of adventure?
            answers:
                - Everything I cared about was threatened.
                - Everything I cared about was destroyed.
                - I was given an offer I couldn't refuse.
                - I was selected by someone to go on a journey.
                - I was in the wrong place at the wrong time.
                - A magic item appeared out of nowhere and thrust me into a world of adventure.
    starting_equipment:
        -   Three gold per character level
            #quantity: 3
            #level_multiplier: true
        -   A Common Quarterstaff
        -   "A Pack Animal"
        -   "Commoner's Clothes"