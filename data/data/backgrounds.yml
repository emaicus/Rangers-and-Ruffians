-   name: Apprentice
    description: "You have spent your life studying under a mentor, likely a master of your chosen class.
                    Your time as an apprentice has left an impact that will last a lifetime."
    options:
        -   question: "How did you meet your mentor?"
            answers:
                - "I was forced into my mentor's service."          
                - "My mentor saw potential in me."
                - "My mentor rescued me and took me in."
                - "My mentor raised me since I was very little."
                - "My mentor is a respected peer."
                - "I have no memory of meeting my mentor."
        -   question: "How is your relationship with your mentor?"
            answers:
                - I have a deep respect for my mentor and follow their orders to the letter.
                - My mentor moves too slowly. I feel like they are holding back.
                - I am one of many of my mentor's students, but I am their favorite.
                - I am one of many of my mentor's students, and feel the need to prove myself.
                - Some people would call my devotion to them unhealthy.
                - I am a disappointment to my mentor.
        -   question: Where is your mentor now?
            answers:
                - My mentor was killed in front of me.
                - My mentor disappeared mysteriously, leaving only a few clues as to their whereabouts.
                - My mentor didn't go anywhere! They are still traveling with me.
                - I ran away from my mentor or was kicked out.
                - My mentor decided that it was time for me to experience the world for by myself.
                - My mentor sent me on a mission while they attended to other matters. 
    starting_equipment: 
        - "Three gold per character level"
          #quantity: 3
          #level_multiplier: true
        - "An Adventurer's Kit"
          #kit: true
        - "Apprentice's Tools"
        - "Commoner's Clothing"
-   name: Wisdom 
    description: "You are wise. Perhaps you have served as a medicine person or lords advisor. Many wisdoms are idiosyncratic; some speak in cryptic riddles while
                   others seem to peer into your soul. A wisdom is a welcome member of any party, helping to steer adventurers in the right direction."
    options:
        -   question: For how long have you been a wisdom?
            answers:
                - I am new to this. I've barely started.
                - I have been a wisdom for some time and have begun to get the hang of it. 
                - I have been a wisdom for decades, and have faced many hard decisions.
                - I am ancient. I've been a wisdom since time immemorable.
        -   question: What is your Wisdom Quirk?
            answers:
                - I am mysterious and speak in riddles.
                - I am incomprehensible and make jokes only I understand.
                - I tell it exactly like it is.
                - I act older than I am, and expect others to help me with tasks.
                - I am cool and collected. When I speak, I expect others to listen.
                - I am deeply unsure of myself. I am not worthy of the respect people give me.
        -   question: From what source do you draw your wisdom?
            answers:
                - I am learned. My wisdom comes from booksmarts.
                - I am knowledgeable. I have my fingers in everything.
                - I am worldwise. My wisdom comes from experience. 
                - I am a conduit. I receive my wisdom from visions, signs, and rituals.
                - I am a member of a tradition. I was trained in the old ways.
                - I am just faking it.
    starting_equipment:
        -   Two gold per character level
            #quantity: 2
            #level_multiplier: true
        -   "A Common Quarterstaff"
        -   "Two Potions of Minor Healing"
            #quantity: 2
        -   "A Potion of Greater Healing"
        -   "A set of Robes"
-   name: Highborn
    description: "You were a member of the upper crust of society. Your affluence brings with it privelege, and your money has
        colored your personality. It takes a real push for a highborn to leave their home and take up the life of an adventurer."
    options:
        -   question: Why did you leave the comfort of your home?
            answers:
                - My family was deposed. I am on the run.
                - My family is in danger, I hope to find a way to save them.
                - I am on a journey to prove myself.
                - I ran away from home.
                - I am travelling abroad for pleasure.
                - Life as a noble was never for me. I burned my bridges and left.
        -   question: What is your highborn's quirk?
            answers:
                - I believe I deserve respect from everyone.
                - I do not understand the value of money.
                - I'm used to having things done for me.
                - I am very easily overwhelmed by minor inconveniences.
                - I am fascinated by the way that ordinary people do things and never learned many life skills.
                - I refuse to take help from anyone.
        -   question: What is your servant like?
            answers:
                - They are an old curmudgeon who only wants what's best for me.
                - They are young and naive and excited to experience the world.
                - They are shy, rarely talking and usually hiding behind me.
                - They are prim and proper and constantly complain about conditions while adventuring.
                - They are my personal chef. They have a sweet disposition and are always trying to fatten me up.
                - They are aged. They have a lot of wisdom, but not as much pep in their step as they used to have.
    starting_equipment:
        -   100 gold per character level
            #quantity: 100
            #level_multiplier: true
        -   "A Masterwork 1 Weapon"
            #masterwork: 1
        -   "An Adventurer's Kit"
            #kit: true
        -   "A Potion of Major Healing"
        -   "Three sets of fine clothes"
            #quantity: 3
        -   "A set of armor"
        -   "A signant of your family's house"
